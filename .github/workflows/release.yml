name: Build and publish Cirava release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install desktop build dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller
          choco install innosetup --yes --no-progress

      - name: Generate release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $notesPath = Join-Path $env:RUNNER_TEMP 'cirava-release-notes.md'
          $checkedNotesPath = Join-Path (Get-Location) "docs/releases/$tag.md"
          if (Test-Path -LiteralPath $checkedNotesPath) {
            $notes = [System.IO.File]::ReadAllText($checkedNotesPath)
          } else {
            $headers = @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
            }
            $body = @{ tag_name = $tag } | ConvertTo-Json
            $releaseNotes = Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/generate-notes" -Headers $headers -Body $body -ContentType 'application/json'
            $notes = [string]$releaseNotes.body
          }
          [System.IO.File]::WriteAllText($notesPath, $notes, [System.Text.UTF8Encoding]::new($false))
          "RELEASE_NOTES_PATH=$notesPath" >> $env:GITHUB_ENV

      - name: Test updater and backend
        shell: pwsh
        run: |
          python -m compileall -q backend
          $env:PYTHONPATH = 'backend'
          python -m unittest discover -s backend/tests -q

      - name: Build installer and update manifest
        id: build
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.Substring(1)
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            throw "Tag '$tag' is not a supported semantic version. Use vMAJOR.MINOR.PATCH[-prerelease]."
          }
          $channel = if ($version.Contains('-')) { 'beta' } else { 'release' }
          $installerBase = "Cirava-Setup-$version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "installer=$installerBase.exe" >> $env:GITHUB_OUTPUT
          $installerPath = "packaging/output/$installerBase.exe"
          $manifestPath = 'packaging/output/update-manifest.json'

          $env:VITE_CIRAVA_APP_VERSION = $version
          $env:VITE_CIRAVA_APP_CHANNEL = $channel
          $env:VITE_CIRAVA_STABLE_MANIFEST_URL = "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/update-manifest.json"
          $env:VITE_CIRAVA_BETA_RELEASES_API_URL = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
          npm ci
          npm run build
          pyinstaller --distpath packaging/output packaging/cirava.spec --noconfirm --clean

          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Inno Setup compiler is missing.' }
          & $compiler 'packaging/cirava.iss' "/DAppVersion=$version" "/DAppOutputBaseFilename=$installerBase" '/DAppOutputDir=output'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath $installerPath)) { throw "Installer was not produced: $installerPath" }

          $releaseNotes = @(
            Get-Content -LiteralPath $env:RELEASE_NOTES_PATH |
              ForEach-Object { ($_ -replace '^\s*[-*]\s+', '' -replace '^#+\s*', '' -replace '\[([^\]]+)\]\([^\)]+\)', '$1').Trim() } |
              Where-Object { $_ } |
              Select-Object -First 12 |
              ForEach-Object { if ($_.Length -gt 220) { $_.Substring(0, 217) + '…' } else { $_ } }
          )
          if (-not $releaseNotes.Count) { $releaseNotes = @('See the GitHub release page for the complete change list.') }

          $releaseBodyPath = Join-Path $env:RUNNER_TEMP 'cirava-release-body.md'
          $notesBody = [System.IO.File]::ReadAllText($env:RELEASE_NOTES_PATH).Trim()
          if (-not $notesBody) { $notesBody = ($releaseNotes | ForEach-Object { "- $_" }) -join "`n" }
          $releaseBody = "## $version`n`n$notesBody`n"
          [System.IO.File]::WriteAllText($releaseBodyPath, $releaseBody, [System.Text.UTF8Encoding]::new($false))
          "releasebody=$releaseBodyPath" >> $env:GITHUB_OUTPUT

          $sha256 = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $assetUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$installerBase.exe"
          $manifest = [ordered]@{
            version = $version
            url = $assetUrl
            sha256 = $sha256
            releaseNotes = [string[]]$releaseNotes
          }
          $json = ConvertTo-Json -InputObject $manifest -Depth 5
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) $manifestPath), $json, [System.Text.UTF8Encoding]::new($false))

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Cirava ${{ steps.build.outputs.version }}
          body_path: ${{ steps.build.outputs.releasebody }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
          files: |
            packaging/output/${{ steps.build.outputs.installer }}
            packaging/output/update-manifest.json
